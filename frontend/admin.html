<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>管理员后台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="p-4 bg-light">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h3>管理后台</h3>
        <a href="index.html" class="btn btn-outline-dark btn-sm">退出</a>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="card p-3 shadow-sm mb-3">
                <h5 class="text-success mb-3">➕ 发布新活动</h5>
                <input id="n" class="form-control mb-2" placeholder="名称">
                <select id="c" class="form-select mb-2">
                    <option>学术</option>
                    <option>文艺</option>
                    <option>体育</option>
                    <option>其他</option>
                </select>
                <input id="t" type="text" class="form-control mb-2" placeholder="截止日期 例如:20250101" maxlength="8">
                <input id="l" class="form-control mb-2" placeholder="地点">
                <input id="m" class="form-control mb-2" value="50" placeholder="人数">
                <button onclick="add()" class="btn btn-success w-100">发布</button>
            </div>
            <div class="card p-3">
                <canvas id="chart"></canvas>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card p-3 shadow-sm">
                <h5 class="mb-3">活动管理列表</h5>
                <div class="table-responsive">
                    <table class="table table-striped align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>详情</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody id="list"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 名单详情弹窗 -->
<div class="modal fade" id="mod" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">报名名单</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted" id="totalCount">共 0 人</span>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="vt" onchange="tv()">
                        <label class="form-check-label">显示详情</label>
                    </div>
                </div>
                <div id="sv" class="p-2 bg-light border rounded">
                    <div id="bd" class="d-flex flex-wrap gap-2"></div>
                    <div id="em1" class="text-center text-muted" style="display:none">暂无</div>
                </div>
                <div id="dv" style="display:none;">
                    <table class="table table-bordered table-sm text-center">
                        <thead class="table-light">
                        <tr>
                            <th>学号</th>
                            <th>姓名</th>
                            <th>班级</th>
                            <th>电话</th>
                        </tr>
                        </thead>
                        <tbody id="tc"></tbody>
                    </table>
                    <div id="em2" class="text-center text-muted" style="display:none">暂无</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let ch = null;
    const mod = new bootstrap.Modal(document.getElementById('mod'));

    async function load() {
        const res = await fetch('/api/activities'), data = await res.json();
        const t = document.getElementById('list');
        t.innerHTML = '';
        data.forEach(x => {
            const dStr = x.deadline;
            const fmtDate = dStr.length === 8 ? `${dStr.substring(0, 4)}-${dStr.substring(4, 6)}-${dStr.substring(6, 8)}` : dStr;

            t.innerHTML += `<tr>
                <td>${x.id}</td>
                <td>
                    <b>${x.name}</b>
                    <span class="badge bg-secondary">${x.category}</span>
                    <br><small class="text-muted">截止:${fmtDate}<br>地点:${x.location}</small>
                </td>
                <td>
                    <span class="badge ${x.status === '报名中' ? 'bg-success' : 'bg-secondary'}">${x.status}</span>
                    <br>
                    <small>${x.count}/${x.max}</small>
                </td>
                <td>
                    <button onclick="showDetails(${x.id})" class="btn btn-sm btn-info text-white">名单</button>
                    <button onclick="del(${x.id})" class="btn btn-sm btn-danger">删除</button>
                </td>
            </tr>`;
        });
        updChart();
    }

    async function add() {
        const b = {
            name: document.getElementById('n').value,
            category: document.getElementById('c').value,
            deadline: document.getElementById('t').value,
            location: document.getElementById('l').value,
            max: parseInt(document.getElementById('m').value)
        };

        if (!/^\d{8}$/.test(b.deadline)) {
            return alert("时间格式错误！请输入8位数字，例如 20250101");
        }

        const res=await fetch(
            '/api/add',
            {
                method: 'POST', body: JSON.stringify(b)
            }
        );
        const d = await res.json();
        if (d.status === "added") {
            document.getElementById('n').value = '';
            document.getElementById('t').value = '';
            document.getElementById('l').value = '';
            document.getElementById('m').value = '50';

            await load();//reload
        } else {
            alert(d.msg || "发布失败");
        }
    }

    async function showDetails(id) {
        const res = await fetch(
            '/api/details',
            {
                method: 'POST', body: JSON.stringify({id})
            }
        );
        const list = await res.json();
        document.getElementById('totalCount').innerText = `共 ${list.length} 人`;
        const bd = document.getElementById('bd');
        bd.innerHTML = '';
        if (list.length === 0)
            document.getElementById('em1').style.display = 'block';
        else {
            document.getElementById('em1').style.display = 'none';
            list.forEach(s => bd.innerHTML += `<span class="badge bg-primary fs-6 fw-normal font-monospace">${s.id}</span>`);
        }
        const tb = document.getElementById('tc');
        tb.innerHTML = '';
        if (list.length === 0)
            document.getElementById('em2').style.display = 'block';
        else {
            document.getElementById('em2').style.display = 'none';
            list.forEach(s => {
                tb.innerHTML += `<tr><td>${s.id}</td><td>${s.name}</td><td>${s.class_name}</td><td>${s.phone}</td></tr>`;
            });
        }
        document.getElementById('vt').checked = false;
        tv();
        mod.show();
    }

    function tv() {
        const d = document.getElementById('vt').checked;
        document.getElementById('sv').style.display = d ? 'none' : 'block';
        document.getElementById('dv').style.display = d ? 'block' : 'none';
    }

    async function del(id) {
        if (confirm('确认删除?')) {
            await fetch(
                '/api/delete',
                {
                    method: 'POST', body: JSON.stringify({id})
                }
            );
            await load();
        }
    }

    async function updChart() {
        const r = await fetch('/api/stats'), d = await r.json();
        if (ch)
            ch.destroy();
        ch = new Chart(
            document.getElementById('chart'),
            {
                type: 'doughnut',
                data: {
                    labels: ['学术', '文艺', '体育', '其他'],
                    datasets: [{
                        data: [d.academic, d.arts, d.sports, d.other],
                        backgroundColor: ['#f87171', '#60a5fa', '#fbbf24', '#34d399']
                    }]
                }
            }
        );
    }
    window.onload = load;
</script>
</body>
</html>
