<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生中心</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
<div class="container">
    <div class="d-flex justify-content-between mb-4">
        <h3>学生中心: <span id="uid"></span></h3>
        <a href="index.html" class="btn btn-outline-dark btn-sm">退出</a>
    </div>
    <div class="card p-3 shadow-sm">
        <h5 class="mb-3">活动报名</h5>
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr>
                    <th>活动</th>
                    <th>时间/地点</th>
                    <th>热度</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody id="tb"></tbody>
            </table>
        </div>
    </div>
</div>
<script>
    const u = localStorage.getItem('u');
    document.getElementById('uid').innerText = u;

    async function load() {
        const res = await fetch('/api/activities'), data = await res.json();
        const t = document.getElementById('tb');
        t.innerHTML = '';
        data.forEach(x => {
            const dStr = x.deadline;
            const tm = dStr.length === 8 ? `${dStr.substring(0, 4)}-${dStr.substring(4, 6)}-${dStr.substring(6, 8)}` : dStr;
            const full = x.count >= x.max, closed = x.status === '已结束', pct = Math.round(x.count / x.max * 100);
            t.innerHTML += `<tr>
                <td>
                    <b>${x.name}</b>
                    <span class="badge bg-light text-dark border">${x.category}</span>
                </td>
                <td>
                    <small class="text-danger">${tm}</small>
                    <br>
                    <small>${x.location}</small>
                </td>
                <td width="200">
                    <small>${x.count}/${x.max}</small>
                    <div class="progress" style="height:5px">
                        <div class="progress-bar ${full ? 'bg-danger' : 'bg-success'}" style="width:${pct}%"></div>
                    </div>
                </td>
                <td>
                    <button onclick="join(${x.id})" class="btn btn-sm btn-primary" ${full || closed ? 'disabled' : ''}>${closed ? '已结束' : (full ? '满员' : '报名')}</button>
                </td>
            </tr>`;
        });
    }

    async function join(id) {
        const r = await fetch(
            '/api/enroll',
            {
                method: 'POST', body: JSON.stringify({id, student_id: u})
            });
        let d = await r.json();
        if (d.status === 'success') {
            alert('报名成功');
            load();
        } else if (d.status === 'repeat') alert('你已报名');
        else if (d.status === 'closed') alert('报名已结束');
        else if (d.status === 'full') alert('人数已满');
        else alert('错误: ' + d.status);
    }
    load();
</script>
</body>
</html>
